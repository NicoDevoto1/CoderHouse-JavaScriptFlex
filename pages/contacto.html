<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contacto | Kondor</title>

  <!-- Bootstrap -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <!-- CSS -->
  <link rel="stylesheet" href="../styles/style.css">
</head>

<body class="contact-page">

  <header class="fixed-top negro-kondor shadow-sm">
        <nav class="navbar navbar-expand-lg navbar-dark p-0">
            <div class="container-fluid px-4">
                <div class="row w-100 align-items-center g-0">
                    <div class="col-lg-4 d-none d-lg-flex gap-3">
                        <a class="nav-link text-white enlace" href="../index.html">Home</a>
                        <a class="nav-link text-white enlace" href="#">Página</a>
                        <a class="nav-link text-white enlace" href="#">Todo lo nuevo</a>
                        <a class="nav-link text-white enlace" href="contacto.html">Contacto</a>
                    </div>

                    <div class="col-6 col-lg-4 text-start text-lg-center">
                        <a class="navbar-brand m-0" href="../index.html">
                            <img src="../assets/KondorBlanco.svg" loading="lazy" alt="Kondor Marca" height="32">
                        </a>
                    </div>

                    <div class="col-6 col-lg-4 d-flex justify-content-end align-items-center gap-3">
                        <div class="d-none d-lg-flex align-items-center gap-3">
                            <a class="nav-link text-white" href="#">Ingresar</a>
                            <a href="../pages/carrito.html" class="btn-carrito-limpio">
                                CARRITO (0)
                            </a>
                        </div>
                        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
                            data-bs-target="#mobileMenu">
                            <span class="navbar-toggler-icon"></span>
                        </button>
                    </div>
                </div>

                <div class="collapse navbar-collapse" id="mobileMenu">
                    <ul class="navbar-nav d-lg-none mt-3 pb-3 text-center border-top border-white-50">
                        <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Página</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Todo lo nuevo</a></li>
                        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                        <li class="nav-item pt-2 border-top border-white-25"><a class="nav-link" href="#">Ingresar</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

  <div class="container-fluid">
    <div class="row">

      <!-- 🔹 COLUMNA IZQUIERDA -->
      <div class="col-lg-6 p-0 d-none d-lg-block split-left">
        <div class="overlay-content h-100 d-flex flex-column justify-content-between p-5 text-white">
          
          <!-- Título grande -->
          <h1 class="big-title">
            Moverte<br>
            <span class="text-white-50">Es</span><br>
            Querer
          </h1>

          <!-- Flecha -->
          <div class="arrow-down display-4">▼</div>

          <!-- Texto inferior -->
          <div class="intro-text">
            <h2 class="fw-bold">Sabemos<br>lo que querés</h2>
            <p class="lead">
              Que la ropa no sea una excusa para empezar
            </p>

            <a href="#" class="btn btn-dark rounded-0 px-4 py-2">
              Saber más
            </a>
          </div>

        </div>
      </div>

      <!-- 🔹 COLUMNA DERECHA -->
      <div class="col-lg-6 d-flex align-items-center justify-content-center">

        <div class="w-75 position-relative">

          <!-- Cerrar -->
          <div class="close-btn position-absolute top-0 end-0 fs-3">
            <a href="../index.html">✕</a>
          </div>

          <!-- Título -->
          <h2 class="fw-bold mb-4">
            Si te interesaste en nosotros<br>
            entonces nosotros estamos interesados en vos.
          </h2>

          <!-- Formulario -->
          <form>
            <div class="mb-3">
              <input 
                type="text"
                class="form-control rounded-0"
                placeholder="Nombre"
              >
            </div>

            <div class="mb-3">
              <input 
                type="email"
                class="form-control rounded-0"
                placeholder="Email"
              >
            </div>

            <div class="mb-4">
              <textarea 
                class="form-control rounded-0" 
                rows="4"
                placeholder="Mensaje"
              ></textarea>
            </div>

            <button 
              type="submit"
              class="btn btn-dark rounded-0 px-5"
            >
              Enviar
            </button>
          </form>

        </div>

      </div>

    </div>
  </div>

</body>
</html>
